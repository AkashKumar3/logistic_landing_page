<section class="relative overflow-hidden bg-slate-950 py-16 lg:py-24">

    <div class="absolute inset-0 bg-slate-950/80"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-blue-950/60 via-slate-900/30 to-slate-950/60"></div>


    <div class="relative z-10 mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">


        <div class="mb-14 text-center">


            <span
                class="inline-block rounded-full border border-blue-400/30 bg-blue-500/10 px-5 py-2 text-sm uppercase tracking-[4px] text-blue-400">

                Our Clients

            </span>


            <h2 class="mt-6 text-3xl font-bold text-white sm:text-4xl lg:text-5xl">

                Trusted By
                <span class="text-blue-400">
                    Leading Brands
                </span>

            </h2>


            <p class="mx-auto mt-5 max-w-3xl text-slate-300">

                We proudly support businesses with reliable logistics,
                transportation, and supply chain solutions.

            </p>


        </div>





        <div class="grid grid-cols-3 gap-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6">



            <div *ngFor="let client of clients" class="client-card group ">


                <div class="client-glow"></div>


                <img [src]="client.logo" [alt]="client.name"
                    [class]="'relative z-10 rounded-lg object-contain transition duration-500 group-hover:scale-110 ' + (client.logoClass || 'h-20 w-20')">


                <!-- <p class="relative z-10 mt-4 text-center text-sm font-semibold text-white">

                    {{client.name}}

                </p> -->


            </div>


        </div>


    </div>


</section>
