<section class="bg-[#0B1120]">

    <div class="max-w-7xl mx-auto">

        <div class="text-center mb-16">

            <p class="text-blue-400 uppercase tracking-[5px] font-semibold">
                OUR SERVICES
            </p>

            <h2 class="text-5xl font-bold text-white mt-4">
                Logistics Solutions
            </h2>

            <p class="text-slate-400 mt-5 max-w-3xl mx-auto">

                We provide reliable transportation,
                warehousing and supply chain management
                tailored for businesses of all sizes.

            </p>

        </div>

        <div class="grid lg:grid-cols-2 gap-10">

            @for(service of services; track service.title){

            <div
                class="group rounded-3xl overflow-hidden bg-slate-900 border border-slate-800 hover:border-blue-500 transition-all duration-500 hover:-translate-y-3">

                <div class="overflow-hidden">

                    <img [src]="service.image" [alt]="service.title"
                        class="h-80 w-full object-cover group-hover:scale-110 transition duration-700">

                </div>

                <div class="p-8">

                    <h3 class="text-3xl font-bold text-white mb-4">

                        {{service.title}}

                    </h3>

                    <p class="text-slate-400 leading-8">

                        {{service.description}}

                    </p>

                </div>

            </div>

            }

        </div>

    </div>

</section>
