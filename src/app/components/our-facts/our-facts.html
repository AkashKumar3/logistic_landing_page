<section #factsSection class="relative overflow-hidden py-14 sm:py-16 lg:py-24">

    <!-- Background -->
    <!-- <img src="assets/images/facts-bg.jpg" alt="Facts Background" class="absolute inset-0 h-full w-full object-cover" /> -->

    <!-- Overlay -->
    <div class="absolute inset-0 bg-slate-950/80"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-blue-950/60 via-slate-900/30 to-slate-950/60"></div>

    <div class="relative z-10 mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

        <!-- Heading -->
        <div class="mb-10 text-center sm:mb-14 lg:mb-20">

            <span
                class="inline-block rounded-full border border-blue-400/40 bg-blue-500/10 px-4 py-2 text-xs font-medium uppercase tracking-[3px] text-blue-400 sm:px-5 sm:text-sm sm:tracking-[4px]">
                Our Facts
            </span>

            <h2 class="mt-4 text-3xl font-bold text-white sm:mt-5 sm:text-4xl lg:mt-6 lg:text-5xl">
                Numbers That Speak
                <span class="text-blue-400">For Us</span>
            </h2>

            <p class="mx-auto mt-4 max-w-3xl text-sm text-slate-300 sm:text-base lg:mt-6 lg:text-lg">
                We deliver reliable logistics and global transportation services.
            </p>

        </div>

        <!-- Facts Cards -->
        <div class="grid grid-cols-2 gap-4 sm:gap-6 lg:grid-cols-4 lg:gap-8">

            <div *ngFor="let fact of facts"
                class="group rounded-2xl border border-white/10 bg-white/5 p-4 text-center backdrop-blur-lg transition-all duration-500 hover:-translate-y-2 hover:border-blue-500 hover:bg-blue-500/10 sm:p-6 lg:rounded-3xl lg:p-10 lg:hover:-translate-y-3">

                <!-- Icon -->
                <div
                    class="mx-auto flex h-14 w-14 items-center justify-center rounded-full border border-blue-400 bg-blue-500/10 text-2xl transition-all duration-300 group-hover:scale-110 sm:h-16 sm:w-16 sm:text-3xl lg:h-24 lg:w-24 lg:text-5xl">
                    <i [class]="fact.icon" class="text-blue-400 transition-all duration-300 group-hover:text-white"></i>
                </div>

                <!-- Animated Number -->
                <h3 class="mt-4 text-3xl font-extrabold text-white sm:text-4xl lg:mt-8 lg:text-6xl">
                    {{ fact.currentValue }}
                </h3>

                <!-- Title -->
                <p class="mt-2 text-sm font-medium text-slate-300 sm:text-base lg:mt-4 lg:text-xl">
                    {{ fact.title }}
                </p>

                <!-- Bottom Line -->
                <div
                    class="mx-auto mt-4 h-1 w-10 rounded-full bg-blue-500 transition-all duration-300 group-hover:w-16 sm:mt-6 lg:mt-8">
                </div>

            </div>

        </div>

    </div>

</section>
