<section #factsSection class="relative overflow-hidden py-24">

    <!-- Background -->
    <img src="assets/images/facts-bg.jpg" class="absolute inset-0 h-full w-full object-cover">

    <div class="absolute inset-0 bg-slate-950/80"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-blue-950/60 via-slate-900/30 to-slate-950/60"></div>

    <div class="relative z-10 max-w-7xl mx-auto px-6">

        <!-- Heading -->
        <div class="text-center mb-20">
            <span
                class="inline-block rounded-full border border-blue-400/40 bg-blue-500/10 px-5 py-2 text-sm uppercase tracking-[4px] text-blue-400">
                Our Facts
            </span>

            <h2 class="mt-6 text-5xl font-bold text-white">
                Numbers That Speak <span class="text-blue-400">For Us</span>
            </h2>

            <p class="mx-auto mt-6 max-w-3xl text-lg text-slate-300">
                We deliver reliable logistics and global transportation services.
            </p>
        </div>

        <!-- Cards -->
        <div class="grid gap-8 sm:grid-cols-2 xl:grid-cols-4">

            <div *ngFor="let fact of facts"
                class="group rounded-3xl border border-white/10 bg-white/5 p-10 text-center backdrop-blur-lg transition-all duration-500 hover:-translate-y-3 hover:border-blue-500 hover:bg-blue-500/10">

                <!-- Icon -->
                <div
                    class="mx-auto flex h-24 w-24 items-center justify-center rounded-full border border-blue-400 bg-blue-500/10 text-5xl">
                    {{ fact.icon }}
                </div>

                <!-- Number (ANIMATED) -->
                <h3 class="mt-8 text-6xl font-extrabold text-white">
                    {{ fact.currentValue }}
                </h3>

                <!-- Title -->
                <p class="mt-4 text-xl text-slate-300">
                    {{ fact.title }}
                </p>

                <div class="mx-auto mt-8 h-1 w-14 rounded-full bg-blue-500"></div>

            </div>

        </div>

    </div>

</section>
